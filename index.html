<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素智能 · 信息中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23289048'/%3E%3C/svg%3E">
<style>
:root{
  --brand:#289048;--brand-dark:#1c7234;--brand-soft:#e9f6ed;
  --bg:#f6f8f7;--card:#fff;--text:#111418;--muted:#6c7784;--line:#dfe6ea;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 4px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;display:flex;flex-direction:column;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  font-size:14px;line-height:1.7;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
.site-head{background:#fff;border-bottom:1px solid var(--line)}
/* 品牌与铃铛两端对齐：铃铛要贴到页面右上角，靠 space-between 把两者推到两端 */
.head-inner{display:flex;align-items:center;justify-content:space-between;height:54px;max-width:1156px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{display:flex;align-items:flex-end;justify-content:center;gap:3px;width:34px;height:34px;padding-bottom:8px;border-radius:9px;background:var(--brand);box-shadow:0 2px 6px rgba(40,144,72,.28)}
.brand-mark i{display:block;width:4px;border-radius:2px;background:#fff}
.brand-mark i:nth-child(1){height:9px}
.brand-mark i:nth-child(2){height:17px}
.brand-mark i:nth-child(3){height:12px}
.brand-text{display:flex;flex-direction:column;line-height:1.3}
.brand-text b{font-size:16px}
.brand-text small{font-size:11px;color:var(--muted)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px}
.hero{width:100%;max-width:980px}
.hero-title{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em}
.hero-sub{margin:6px 0 34px;font-size:14px;color:var(--muted)}
.entries{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.entry{
  display:flex;flex-direction:column;min-height:230px;padding:30px;
  color:var(--text);text-decoration:none;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.entry:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,24,40,.13),0 2px 6px rgba(16,24,40,.06)}
.e-icon{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand)}
.e-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;font-size:19px;font-weight:700}
.e-arrow{color:#98a1ac;transition:color .18s ease,transform .18s ease}
.entry:hover .e-arrow{color:var(--brand);transform:translateX(3px)}
.entry p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.e-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.e-tags span{padding:1px 10px;border-radius:999px;background:#f1f3f5;color:#5b6673;font-size:12px}
.e-foot{margin-top:auto;padding-top:18px;font-size:12px;color:var(--muted)}
.e-foot b{color:var(--brand-dark)}
.entry{animation:cardIn .3s ease both}
.entry:nth-child(2){animation-delay:.08s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.site-foot{border-top:1px solid var(--line);background:#fff}
.foot-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;max-width:1156px;margin:0 auto;padding:13px 20px;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  main{padding:32px 14px;align-items:flex-start}
  .entries{grid-template-columns:1fr}
  .entry{min-height:0;padding:22px}
  .hero-title{font-size:21px}
}
/* 通知栏：铃铛 + 遮罩 + 右侧抽屉。颜色、圆角、字体全部沿用页面既有变量，不引外部字体/图标库（铃铛用内联 SVG） */
.bell{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);cursor:pointer}
.bell:hover{border-color:var(--brand);color:var(--brand)}
.bell-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#e5484d;border:1.5px solid #fff}
.notice-mask{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.28);opacity:0;pointer-events:none;transition:opacity .18s ease}
.notice-mask.on{opacity:1;pointer-events:auto}
.notice-panel{position:fixed;top:0;right:0;z-index:41;width:min(380px,100vw);height:100vh;background:var(--card);box-shadow:-8px 0 30px rgba(16,24,40,.14);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.notice-panel.on{transform:none}
.np-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
.np-close{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.np-close:hover{color:var(--brand)}
.np-list{flex:1;overflow:auto;padding:4px 18px 24px}
.np-item{padding:14px 0;border-bottom:1px solid var(--line)}
.np-item:last-child{border-bottom:0}
.np-date{font-size:12px;color:var(--muted)}
.np-pin{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px}
.np-title{margin:5px 0 6px;font-size:15px;font-weight:700;line-height:1.4}
.np-body{margin:0;font-size:13px;line-height:1.7;color:#3c4650;white-space:pre-wrap;word-break:break-word}
.np-empty{padding:48px 0;text-align:center;color:var(--muted);font-size:13px}
/* 移动端抽屉占满整屏宽度，否则 380px 会留出一条盖不住页面的缝 */
@media (max-width:760px){ .notice-panel{width:100vw} }
</style>
</head>
<body>

        <span class="e-icon" aria-hidden="true">

        </span>

      </a>
      <a class="entry" href="/Xiangsu/">
        <span class="e-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3.5-4 3 2.5L18 7"/><circle cx="7" cy="14" r="1.2"/><circle cx="18" cy="7" r="1.2"/></svg>

<!-- 通知栏：遮罩 + 右侧抽屉。放在 main 之后、页脚之前，避免被卡片动画影响定位 -->
<div class="notice-mask" id="notice-mask"></div>
<aside class="notice-panel" id="notice-panel" role="dialog" aria-modal="true" aria-label="通知区" aria-hidden="true" inert>
  <div class="np-head">
    <span>通知</span>
    <button class="np-close" id="notice-close" type="button" aria-label="关闭">&times;</button>
  </div>
  <div class="np-list" id="notice-list"></div>
</aside>
<!-- 通知数据由 tools/build_portal.py 注入这两个标记之间，日常发通知只改 notices.json，不要手工编辑本区间 -->
<!-- NOTICES:BEGIN -->
<script>window.__NOTICES__=[{"id":"20260929-01","date":"2026-09-29","title":"1#锡 现货已恢复每日更新","body":"长江有色把 1#锡 从列表页下架了，导致锡价停在 9/21。已改用其报价接口，现在随全站抓取每天更新 3 次（07:30 / 12:30 / 18:30），现货和期货都能看到当日价。","pinned":true},{"id":"20260929-02","date":"2026-09-29","title":"服务器 10 月 18 日到期，请注意续费","body":"承载本站的阿里云轻量服务器将于 10 月 18 日到期。请部门负责人在 10 月 10 日前确认续费，以免站点中断。","pinned":false}];window.__NOTICE_LATEST__="20260929-01";</script>
<!-- NOTICES:END -->
<script>
(function () {
  var KEY = 'portal_notice_read_id';
  var list = window.__NOTICES__ || [];
  var latest = window.__NOTICE_LATEST__ || '';
  var bell = document.getElementById('notice-bell');
  var dot = document.getElementById('notice-dot');
  var panel = document.getElementById('notice-panel');
  var mask = document.getElementById('notice-mask');
  var closeBtn = document.getElementById('notice-close');
  var box = document.getElementById('notice-list');

  // 面板声明了 aria-modal="true"，等于向辅助技术承诺"焦点被关在面板里"，
  // 屏幕阅读器也会因此不再朗读背景内容。这时如果 Tab 还能走到背景卡片上，
  // 就成了"宣称模态、实际不模态"：用户耳朵里没有背景，焦点却掉进了背景，
  // 比不写 aria-modal 更糟。所以焦点陷阱是 aria-modal 的必要配套，不是可选优化。
  // 另：inert 只作用于面板自己，管不到页面其余部分，这一半只能在这里补。
  var FOCUSABLE = 'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])';

  function readId() {
    // 隐私模式/存储被禁用时 localStorage 会抛错，这里返回 null 表示"读不到"，
    // 与"读到空串（从未读过）"必须区分：读不到时红点没有依据，按全局约束一律不亮，
    // 否则 markRead() 同样写不进去、红点会永远消不掉。两种情况都不打断页面。
    try { return localStorage.getItem(KEY) || ''; } catch (e) { return null; }
  }
  function markRead() {
    // 只在真的有通知时落盘，避免把空串写进去覆盖后续已读状态
    try { if (latest) localStorage.setItem(KEY, latest); } catch (e) { /* 隐私模式：静默降级 */ }
  }
  function render() {
    if (!list.length) {
      box.textContent = '';
      var empty = document.createElement('p');
      empty.className = 'np-empty';
      empty.textContent = '暂无通知';
      box.appendChild(empty);
      return;
    }
    box.textContent = '';
    list.forEach(function (n) {
      // 通知内容全部走 textContent：标题/正文是纯文本，不允许被当成 HTML 解析
      var item = document.createElement('article');
      item.className = 'np-item';
      var date = document.createElement('div');
      date.className = 'np-date';
      date.textContent = n.date;
      if (n.pinned) {
        var pin = document.createElement('span');
        pin.className = 'np-pin';
        pin.textContent = '置顶';
        date.appendChild(pin);
      }
      var title = document.createElement('h3');
      title.className = 'np-title';
      title.textContent = n.title;
      var body = document.createElement('p');
      body.className = 'np-body';
      body.textContent = n.body;
      item.appendChild(date);
      item.appendChild(title);
      item.appendChild(body);
      box.appendChild(item);
    });
  }
  function paint() {
    // 无通知（latest 空）不显示红点；已读最新一条不显示；
    // seen 为 null 说明存储不可用，读写都不可靠，红点没有可信依据，同样不显示。
    var seen = readId();
    dot.hidden = !(latest && seen !== null && seen !== latest);
  }
  function open() {
    panel.classList.add('on');
    // inert 要跟着开合切换：抽屉只是被 transform 移出屏幕，元素仍可聚焦，
    // 关闭状态下按 Tab 会落到屏幕外的「关闭」按钮上。
    panel.removeAttribute('inert');
    panel.setAttribute('aria-hidden', 'false');
    mask.classList.add('on');
    bell.setAttribute('aria-expanded', 'true');
    markRead();
    paint();
    // 焦点移进抽屉，否则屏幕阅读器停在铃铛上、不会播报抽屉里的通知
    closeBtn.focus();
  }
  function close() {
    panel.classList.remove('on');
    // inert 同时把抽屉移出 Tab 序列和无障碍树：否则关闭后焦点仍可进入
    // 屏幕外的按钮，且 aria-hidden="true" 裹着可聚焦元素（axe 的 aria-hidden-focus）
    panel.setAttribute('inert', '');
    panel.setAttribute('aria-hidden', 'true');
    mask.classList.remove('on');
    bell.setAttribute('aria-expanded', 'false');
    // 焦点交还给触发它的铃铛，键盘用户不会掉回文档开头
    bell.focus();
  }
  render();
  paint();
  bell.addEventListener('click', function () {
    if (panel.classList.contains('on')) { close(); } else { open(); }
  });
  closeBtn.addEventListener('click', close);
  mask.addEventListener('click', close);
  // 面板关闭时 close() 会把焦点交还铃铛，若此时也响应 Esc，键盘用户在页面里随手按一下键焦点就会跳走
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && panel.classList.contains('on')) { close(); } });

  // 通用实现：每次按键现查一遍面板内的可聚焦元素，不写死"只有关闭按钮"。
  // 以后面板里加通知里的链接、按钮、分页，不用回来改这段。
  function trapTab(e) {
    // 面板关闭时一律不拦：关闭态由 inert 把面板移出 Tab 序列，
    // 页面其余部分必须保持浏览器默认的 Tab 顺序，别抢。
    if (!panel.classList.contains('on')) return;
    if (e.key !== 'Tab') return;
    // 过滤 hidden：隐藏节点不可见也不该接收焦点，留着会让循环停在一个看不见的位置
    var nodes = Array.prototype.filter.call(panel.querySelectorAll(FOCUSABLE), function (el) { return !el.hidden; });
    // 一个可聚焦元素都没有时也吞掉 Tab，否则焦点会从空面板里逃出去
    if (!nodes.length) { e.preventDefault(); return; }
    var first = nodes[0];
    var last = nodes[nodes.length - 1];
    var cur = document.activeElement;
    // 焦点不在面板内（面板刚打开、或将来新增了别的触发方式）时先收回来
    if (nodes.indexOf(cur) === -1) { e.preventDefault(); first.focus(); return; }
    // 到边界就绕回另一端，阻止默认行为避免浏览器把焦点交给背景
    if (e.shiftKey) {
      if (cur === first) { e.preventDefault(); last.focus(); }
    } else if (cur === last) {
      e.preventDefault(); first.focus();
    }
  }
  document.addEventListener('keydown', trapTab);
})();
</script>
